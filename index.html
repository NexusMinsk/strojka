<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прелоадер — строительство домика</title>
    <style>
        /* Базовый фон как на сайте */
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0e0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        /* ===== ПРЕЛОАДЕР (ДОМИК СОБИРАЕТСЯ) ===== */
        #preloader {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .house-container {
            width: 260px;
            height: 260px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* строительные линии / арматура (фон) — медленное вращение */
        .construction-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 95, 31, 0.2);
            border-radius: 4px;
            animation: rotateSlow 24s infinite linear;
        }

        @keyframes rotateSlow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* SVG домика */
        .house-svg {
            width: 200px;
            height: 200px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(255, 95, 31, 0.4));
        }

        /* Все элементы изначально невидимы */
        .house-svg .house-base,
        .house-svg .house-wall,
        .house-svg .house-roof,
        .house-svg .house-door,
        .house-svg .house-window,
        .house-svg .house-chimney {
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        /* Классы для поэтапного показа */
        .house-svg.show-base .house-base {
            opacity: 1;
        }

        .house-svg.show-wall .house-wall {
            opacity: 1;
        }

        .house-svg.show-roof .house-roof {
            opacity: 1;
        }

        .house-svg.show-door .house-door {
            opacity: 1;
        }

        .house-svg.show-window .house-window {
            opacity: 1;
        }

        .house-svg.show-chimney .house-chimney {
            opacity: 1;
        }

        /* Текст загрузки */
        .loader-text {
            margin-top: 30px;
            font-size: 16px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #888;
            font-weight: 400;
        }

        .loader-text span {
            color: #ff5f1f;
            font-weight: 600;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* Прогресс */
        .loader-progress {
            margin-top: 12px;
            font-size: 14px;
            color: #ff5f1f;
            font-family: 'Inter', monospace;
            letter-spacing: 3px;
            font-weight: 300;
            background: rgba(255, 95, 31, 0.1);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 95, 31, 0.3);
        }
    </style>
</head>

<body>
    <div id="preloader">
        <div class="house-container">
            <div class="construction-lines"></div>
            <svg class="house-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Фундамент (плита) -->
                <rect class="house-base" x="40" y="150" width="120" height="8" fill="#ff5f1f" rx="2" />
                <!-- Основная стена (коробка) -->
                <rect class="house-wall" x="50" y="80" width="100" height="70" fill="#2a2e33" stroke="#ff5f1f"
                    stroke-width="2" />
                <!-- Крыша (два ската) -->
                <polygon class="house-roof" points="100,30 150,80 50,80 100,30" fill="#3a3029" stroke="#ff5f1f"
                    stroke-width="2" />
                <!-- Дверь -->
                <rect class="house-door" x="80" y="115" width="25" height="35" fill="#1e1e1e" stroke="#ff5f1f"
                    stroke-width="1.5" />
                <!-- Окно -->
                <rect class="house-window" x="110" y="105" width="20" height="20" fill="#0c0e0d" stroke="#ff5f1f"
                    stroke-width="1.5" />
                <!-- Труба на крыше -->
                <rect class="house-chimney" x="115" y="45" width="15" height="25" fill="#4a3e35" stroke="#ff5f1f"
                    stroke-width="1.5" />
            </svg>
            <div class="loader-text">СТРОИМ<span></span></div>
            <div class="loader-progress" id="progressPercent">0%</div>
        </div>
    </div>

    <script>
        (function () {
            const houseSvg = document.querySelector('.house-svg');
            const progressSpan = document.getElementById('progressPercent');
            const preloader = document.getElementById('preloader');

            // Порядок строительства (6 этапов)
            const stages = ['show-base', 'show-wall', 'show-roof', 'show-door', 'show-window', 'show-chimney'];
            let currentStage = 0;

            // Удаляем все классы на всякий случай
            houseSvg.classList.remove(...stages);

            // Функция добавления следующей части
            function buildNext() {
                if (currentStage < stages.length) {
                    // Добавляем текущий этап
                    houseSvg.classList.add(stages[currentStage]);

                    // Обновляем процент
                    let percent = Math.min(100, Math.round((currentStage + 1) / stages.length * 100));
                    if (progressSpan) progressSpan.textContent = percent + '%';

                    currentStage++;
                }

                // Если всё построено
                if (currentStage >= stages.length) {
                    clearInterval(buildInterval);
                    progressSpan.textContent = 'ГОТОВО';

                    // Плавно скрываем прелоадер и делаем редирект
                    setTimeout(() => {
                        preloader.style.opacity = '0';
                        setTimeout(() => {
                            window.location.href = 'home34.html';
                        }, 500);
                    }, 600);
                }
            }

            // Интервал строительства 400 мс
            let buildInterval = setInterval(buildNext, 400);

            // Страховка: если вдруг что-то пойдет не так, редирект через 5 секунд
            setTimeout(() => {
                if (window.location.href.indexOf('home34.html') === -1) {
                    window.location.href = 'home34.html';
                }
            }, 5000);
        })();
    </script>
</body>

</html>
