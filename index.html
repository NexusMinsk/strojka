<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прелоадер — стройка с эффектами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0c0e0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0e0d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.6s ease;
        }

        .canvas-container {
            position: relative;
            width: 600px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 95, 31, 0.3));
            animation: float 3s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #houseCanvas {
            z-index: 2;
            filter: drop-shadow(0 0 8px #ff5f1f);
        }

        #linesCanvas {
            z-index: 1;
        }

        #glowCanvas {
            z-index: 0;
            opacity: 0.6;
        }

        .loader-content {
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .loader-text {
            font-size: 18px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #888;
            font-weight: 400;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,95,31,0.3);
        }

        .loader-text span {
            color: #ff5f1f;
            font-weight: 600;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #ff5f1f; }
            50% { opacity: 0.6; text-shadow: 0 0 20px #ff5f1f; }
        }

        .loader-progress {
            font-size: 16px;
            color: #ff5f1f;
            font-family: monospace;
            letter-spacing: 3px;
            background: rgba(255,95,31,0.1);
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255,95,31,0.3);
            display: inline-block;
            backdrop-filter: blur(2px);
            box-shadow: 0 0 15px rgba(255,95,31,0.2);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff5f1f;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="canvas-container">
            <canvas id="glowCanvas"></canvas>
            <canvas id="linesCanvas"></canvas>
            <canvas id="houseCanvas"></canvas>
        </div>

        <div class="loader-content">
            <div class="loader-text">СТРОИМ<span>//</span></div>
            <div class="loader-progress" id="progressPercent">0%</div>
        </div>
    </div>

    <script>
        (function() {
            const houseCanvas = document.getElementById('houseCanvas');
            const linesCanvas = document.getElementById('linesCanvas');
            const glowCanvas = document.getElementById('glowCanvas');
            const ctx = houseCanvas.getContext('2d');
            const linesCtx = linesCanvas.getContext('2d');
            const glowCtx = glowCanvas.getContext('2d');
            const progressSpan = document.getElementById('progressPercent');
            const preloader = document.getElementById('preloader');
            const container = document.querySelector('.canvas-container');

            // Размеры
            const w = 600, h = 500;
            houseCanvas.width = w;
            houseCanvas.height = h;
            linesCanvas.width = w;
            linesCanvas.height = h;
            glowCanvas.width = w;
            glowCanvas.height = h;

            // Центр дома
            const cx = w / 2;
            const cy = h / 2 - 20;

            // ---- ВСЕ ЛИНИИ ДОМА (32 штуки) ----
            const lines = [
                // Фундамент (2 линии) - снизу
                { id: 0, x1: cx - 90, y1: cy + 70, x2: cx - 10, y2: cy + 70, side: 'bottom' },
                { id: 1, x1: cx + 10, y1: cy + 70, x2: cx + 90, y2: cy + 70, side: 'bottom' },
                
                // Левая стена (вертикаль) - слева
                { id: 2, x1: cx - 90, y1: cy + 70, x2: cx - 90, y2: cy - 40, side: 'left' },
                
                // Правая стена (вертикаль) - справа
                { id: 3, x1: cx + 90, y1: cy + 70, x2: cx + 90, y2: cy - 40, side: 'right' },
                
                // Потолок (горизонталь) - сверху
                { id: 4, x1: cx - 90, y1: cy - 40, x2: cx + 90, y2: cy - 40, side: 'top' },
                
                // Крыша левая - сверху
                { id: 5, x1: cx - 90, y1: cy - 40, x2: cx, y2: cy - 130, side: 'top' },
                
                // Крыша правая - сверху
                { id: 6, x1: cx + 90, y1: cy - 40, x2: cx, y2: cy - 130, side: 'top' },
                
                // Перекладина под крышей
                { id: 7, x1: cx - 60, y1: cy - 70, x2: cx + 60, y2: cy - 70, side: 'left' },
                
                // Дверь
                { id: 8, x1: cx - 30, y1: cy + 40, x2: cx - 30, y2: cy - 10, side: 'left' },
                { id: 9, x1: cx + 30, y1: cy + 40, x2: cx + 30, y2: cy - 10, side: 'right' },
                { id: 10, x1: cx - 30, y1: cy - 10, x2: cx + 30, y2: cy - 10, side: 'top' },
                { id: 11, x1: cx - 15, y1: cy + 15, x2: cx - 10, y2: cy + 15, side: 'left' },
                
                // Окно левое
                { id: 12, x1: cx - 70, y1: cy, x2: cx - 70, y2: cy - 35, side: 'left' },
                { id: 13, x1: cx - 40, y1: cy, x2: cx - 40, y2: cy - 35, side: 'right' },
                { id: 14, x1: cx - 70, y1: cy - 35, x2: cx - 40, y2: cy - 35, side: 'top' },
                { id: 15, x1: cx - 70, y1: cy, x2: cx - 40, y2: cy, side: 'bottom' },
                { id: 16, x1: cx - 70, y1: cy - 17, x2: cx - 40, y2: cy - 17, side: 'left' },
                { id: 17, x1: cx - 55, y1: cy, x2: cx - 55, y2: cy - 35, side: 'bottom' },
                
                // Окно правое
                { id: 18, x1: cx + 40, y1: cy - 5, x2: cx + 40, y2: cy - 40, side: 'left' },
                { id: 19, x1: cx + 70, y1: cy - 5, x2: cx + 70, y2: cy - 40, side: 'right' },
                { id: 20, x1: cx + 40, y1: cy - 40, x2: cx + 70, y2: cy - 40, side: 'top' },
                { id: 21, x1: cx + 40, y1: cy - 5, x2: cx + 70, y2: cy - 5, side: 'bottom' },
                { id: 22, x1: cx + 40, y1: cy - 22, x2: cx + 70, y2: cy - 22, side: 'right' },
                { id: 23, x1: cx + 55, y1: cy - 5, x2: cx + 55, y2: cy - 40, side: 'bottom' },
                
                // Труба
                { id: 24, x1: cx + 20, y1: cy - 100, x2: cx + 20, y2: cy - 140, side: 'top' },
                { id: 25, x1: cx + 50, y1: cy - 100, x2: cx + 50, y2: cy - 140, side: 'top' },
                { id: 26, x1: cx + 20, y1: cy - 140, x2: cx + 50, y2: cy - 140, side: 'top' },
                { id: 27, x1: cx + 20, y1: cy - 100, x2: cx + 50, y2: cy - 100, side: 'top' },
                
                // Чердачное окно
                { id: 28, x1: cx - 10, y1: cy - 70, x2: cx + 10, y2: cy - 70, side: 'top' },
                { id: 29, x1: cx, y1: cy - 80, x2: cx, y2: cy - 60, side: 'top' },
                
                // Конёк крыши
                { id: 30, x1: cx - 5, y1: cy - 130, x2: cx + 5, y2: cy - 130, side: 'top' },
                
                // Земля
                { id: 31, x1: cx - 120, y1: cy + 80, x2: cx + 120, y2: cy + 80, side: 'bottom' }
            ];

            // Состояние линий
            const progressMap = {};
            lines.forEach(l => progressMap[l.id] = 0);

            const lineOrder = lines.map(l => l.id);
            let activatedCount = 0;
            const totalLines = lines.length;

            // Создание искр при появлении линий
            function createSparks(x, y) {
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = i % 2 === 0 ? '#ff5f1f' : '#ffaa00';
                    particle.style.boxShadow = '0 0 10px currentColor';
                    
                    const angle = (i / 6) * Math.PI * 2 + Math.random();
                    const speed = 2 + Math.random() * 3;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    
                    container.appendChild(particle);
                    
                    let opacity = 1;
                    let posX = x;
                    let posY = y;
                    
                    const animate = () => {
                        posX += vx;
                        posY += vy;
                        opacity -= 0.02;
                        
                        particle.style.transform = `translate(${posX - x}px, ${posY - y}px)`;
                        particle.style.opacity = opacity;
                        
                        if (opacity > 0) {
                            requestAnimationFrame(animate);
                        } else {
                            particle.remove();
                        }
                    };
                    
                    requestAnimationFrame(animate);
                }
            }

            // Запуск очереди
            lineOrder.forEach((lineId, index) => {
                setTimeout(() => {
                    const line = lines.find(l => l.id === lineId);
                    
                    // Искра в точке старта линии
                    if (line) {
                        let sparkX, sparkY;
                        switch(line.side) {
                            case 'left': sparkX = 50; sparkY = line.y1; break;
                            case 'right': sparkX = w - 50; sparkY = line.y1; break;
                            case 'top': sparkX = line.x1; sparkY = 50; break;
                            case 'bottom': sparkX = line.x1; sparkY = h - 50; break;
                            default: sparkX = cx; sparkY = cy;
                        }
                        createSparks(sparkX, sparkY);
                    }
                    
                    let startTime = Date.now();
                    const duration = 450;
                    
                    const updateInterval = setInterval(() => {
                        const elapsed = Date.now() - startTime;
                        const p = Math.min(1, elapsed / duration);
                        
                        let eased = p;
                        if (p < 1) {
                            eased = p + (1 - p) * 0.4 * Math.sin(p * Math.PI * 3);
                        } else {
                            eased = 1;
                        }
                        
                        progressMap[lineId] = Math.min(1, Math.max(0, eased));
                        
                        if (p >= 1) {
                            clearInterval(updateInterval);
                            activatedCount++;
                            
                            const percent = Math.round((activatedCount / totalLines) * 100);
                            progressSpan.textContent = percent + '%';
                            
                            if (activatedCount === totalLines) {
                                progressSpan.textContent = 'ГОТОВО';
                                
                                // Финальная вспышка
                                for (let i = 0; i < 20; i++) {
                                    setTimeout(() => {
                                        createSparks(cx + (Math.random() - 0.5) * 200, cy - 40 + (Math.random() - 0.5) * 150);
                                    }, i * 30);
                                }
                                
                                setTimeout(() => {
                                    preloader.style.opacity = '0';
                                    setTimeout(() => {
                                        window.location.href = 'home34.html';
                                    }, 600);
                                }, 1000);
                            }
                        }
                    }, 20);
                    
                }, index * 80); // Чуть быстрее
            });

            // Рисование с эффектами
            function draw() {
                // Основной дом
                ctx.clearRect(0, 0, w, h);
                
                // Добавляем эффект свечения
                ctx.shadowColor = '#ff5f1f';
                ctx.shadowBlur = 10;
                
                ctx.strokeStyle = '#ff5f1f';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                
                lines.forEach(line => {
                    const prog = progressMap[line.id];
                    if (prog <= 0) return;
                    
                    // Динамическое свечение в зависимости от прогресса
                    ctx.shadowBlur = 5 + prog * 10;
                    
                    const side = line.side || 'bottom';
                    
                    let startX = line.x1;
                    let startY = line.y1;
                    
                    switch(side) {
                        case 'left': startX = -50; startY = line.y1; break;
                        case 'right': startX = w + 50; startY = line.y1; break;
                        case 'top': startX = line.x1; startY = -50; break;
                        case 'bottom': startX = line.x1; startY = h + 50; break;
                    }
                    
                    const currX1 = startX + (line.x1 - startX) * prog;
                    const currY1 = startY + (line.y1 - startY) * prog;
                    
                    let startX2, startY2;
                    switch(side) {
                        case 'left': startX2 = -50; startY2 = line.y2; break;
                        case 'right': startX2 = w + 50; startY2 = line.y2; break;
                        case 'top': startX2 = line.x2; startY2 = -50; break;
                        case 'bottom': startX2 = line.x2; startY2 = h + 50; break;
                        default: startX2 = line.x2; startY2 = line.y2;
                    }
                    
                    const currX2 = startX2 + (line.x2 - startX2) * prog;
                    const currY2 = startY2 + (line.y2 - startY2) * prog;
                    
                    ctx.beginPath();
                    ctx.moveTo(currX1, currY1);
                    ctx.lineTo(currX2, currY2);
                    ctx.stroke();
                });
                
                // Сбрасываем тень
                ctx.shadowBlur = 0;
                
                // Фоновая сетка
                linesCtx.clearRect(0, 0, w, h);
                linesCtx.strokeStyle = 'rgba(255, 95, 31, 0.15)';
                linesCtx.lineWidth = 1;
                linesCtx.setLineDash([5, 8]);
                
                for (let x = 50; x < w; x += 50) {
                    linesCtx.beginPath();
                    linesCtx.moveTo(x, 20);
                    linesCtx.lineTo(x, h - 20);
                    linesCtx.stroke();
                }
                
                for (let y = 50; y < h; y += 50) {
                    linesCtx.beginPath();
                    linesCtx.moveTo(20, y);
                    linesCtx.lineTo(w - 20, y);
                    linesCtx.stroke();
                }
                
                // Свечение вокруг центра (glow)
                glowCtx.clearRect(0, 0, w, h);
                const gradient = glowCtx.createRadialGradient(cx, cy - 20, 50, cx, cy - 20, 250);
                gradient.addColorStop(0, 'rgba(255, 95, 31, 0.15)');
                gradient.addColorStop(1, 'rgba(255, 95, 31, 0)');
                
                glowCtx.fillStyle = gradient;
                glowCtx.fillRect(0, 0, w, h);
                
                requestAnimationFrame(draw);
            }
            
            draw();

            // Страховочный редирект
            setTimeout(() => {
                if (window.location.href.indexOf('home34.html') === -1) {
                    window.location.href = 'home34.html';
                }
            }, 12000);
        })();
    </script>
</body>
</html>
